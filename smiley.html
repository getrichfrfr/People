<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smiley</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1b1b1f;
      }

      .face {
        position: relative;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe680, #f5c518 60%, #c89b00);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      }

      .eye {
        position: absolute;
        top: 78px;
        width: 32px;
        height: 42px;
        border-radius: 50%;
        background: #222;
      }
      .eye.left  { left: 64px; }
      .eye.right { right: 64px; }

      .mouth {
        position: absolute;
        left: 50%;
        bottom: 70px;
        width: 120px;
        transform: translateX(-50%);
        background: #222;
        overflow: hidden;
        height: 6px;
        border-radius: 3px;
        animation: smile 2.4s cubic-bezier(0.45, 0.05, 0.25, 1) 0.6s forwards;
      }
      .mouth::after {
        content: "";
        position: absolute;
        left: 10%;
        bottom: -30px;
        width: 80%;
        height: 30px;
        border-radius: 50%;
        background: #ff6b8a;
        opacity: 0;
        animation: tongue 1.2s ease 2.4s forwards;
      }

      @keyframes smile {
        0% {
          height: 6px;
          bottom: 70px;
          border-radius: 3px;
        }
        100% {
          height: 60px;
          bottom: 52px;
          border-radius: 3px 3px 120px 120px / 3px 3px 60px 60px;
        }
      }

      @keyframes tongue {
        to { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="face" role="img" aria-label="Smiley face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
  </body>
</html>
