<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Smiley</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #1b1b1f;
      }

      .face {
        position: relative;
        width: 240px;
        height: 240px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe680, #f5c518 60%, #c89b00);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
      }

      .eye {
        position: absolute;
        top: 78px;
        width: 32px;
        height: 42px;
        border-radius: 50%;
        background: #222;
      }
      .eye.left  { left: 64px; }
      .eye.right { right: 64px; }

      .mouth {
        position: absolute;
        left: 50%;
        bottom: 52px;
        width: 120px;
        height: 60px;
        transform: translateX(-50%);
        border-bottom-left-radius: 120px 60px;
        border-bottom-right-radius: 120px 60px;
        background: #222;
        overflow: hidden;
      }
      .mouth::after {
        content: "";
        position: absolute;
        left: 10%;
        bottom: -30px;
        width: 80%;
        height: 30px;
        border-radius: 50%;
        background: #ff6b8a;
      }
    </style>
  </head>
  <body>
    <div class="face" role="img" aria-label="Smiley face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
    </div>
  </body>
</html>
